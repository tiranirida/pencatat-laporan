# Cloudflare Pages: frontend Next.js (static export) dengan build command
# `npm install && npm run build`, output folder out/.
# D1 binding di-set di Dashboard Pages > Settings > Functions > D1 bindings
# dengan nama variabel DB. Contoh untuk wrangler CLI (opsional):
#
# [[d1_databases]]
# binding = "DB"
# database_name = "pencatat-laporan"
# database_id = "ISI_ID_D1_DARI_DASHBOARD"
name = "pencatat-laporan"
pages_build_output_dir = "out"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "pencatat-laporan"
database_id = "054beb9f-91c6-4c7d-9ca2-df7510d6d19a"
